services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-pulsechat}
      MYSQL_USER: ${MYSQL_USER:-pulsechat}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    volumes:
      - pulsechat-mysql:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_STREAM_API_KEY: ${NEXT_PUBLIC_STREAM_API_KEY:?Set NEXT_PUBLIC_STREAM_API_KEY in .env}
    env_file: .env
    environment:
      DATABASE_URL: mysql://${MYSQL_USER:-pulsechat}:${MYSQL_PASSWORD}@db:3306/${MYSQL_DATABASE:-pulsechat}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?Set BETTER_AUTH_URL in .env}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET in .env}
      AUTHY_ISSUER: ${AUTHY_ISSUER:?Set AUTHY_ISSUER in .env}
      AUTHY_CLIENT_ID: ${AUTHY_CLIENT_ID:?Set AUTHY_CLIENT_ID in .env}
      AUTHY_CLIENT_SECRET: ${AUTHY_CLIENT_SECRET:?Set AUTHY_CLIENT_SECRET in .env}
      NEXT_PUBLIC_STREAM_API_KEY: ${NEXT_PUBLIC_STREAM_API_KEY:?Set NEXT_PUBLIC_STREAM_API_KEY in .env}
      STREAM_API_SECRET: ${STREAM_API_SECRET:?Set STREAM_API_SECRET in .env}
      NODE_ENV: production
    ports:
      - "${PULSECHAT_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://127.0.0.1:3000/api/health",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

volumes:
  pulsechat-mysql:
